name: Android preview APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-client/**', '.github/workflows/android-preview.yml']
  pull_request:
    paths: ['android-client/**', '.github/workflows/android-preview.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test, lint and build installable preview
        working-directory: android-client
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CL-Paints-Android-preview
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
