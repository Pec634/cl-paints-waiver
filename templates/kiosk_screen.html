{% extends 'base.html' %}{% block body %}<main class="kiosk-shell"><header><strong>CL Paints · {{ event.name }}</strong><button class="btn" id="kioskFullscreen">Full screen</button><button class="btn" id="kioskStaffOpen">Exit kiosk</button></header>{% for category,message in get_flashed_messages(with_categories=true) %}<p role="alert">{{ message }}</p>{% endfor %}<iframe sandbox="allow-forms allow-scripts allow-same-origin" title="Customer signup and waiver" src="{{ url_for('kiosk_customer') }}"></iframe><dialog id="kioskStaffDialog"><h2>Staff unlock</h2><form method="post" action="{{ url_for('kiosk_staff') }}" class="client-form"><input type="hidden" name="csrf_token" value="{{ item.csrf }}"><label>Staff PIN<input type="password" name="pin" inputmode="numeric" maxlength="8" autocomplete="off" required></label><input type="hidden" name="action" value="exit"><button class="btn primary">Unlock</button><button class="btn" type="button" id="kioskStaffClose">Close</button></form></dialog></main><script>const kioskDialog=document.getElementById('kioskStaffDialog');document.getElementById('kioskStaffOpen').onclick=()=>kioskDialog.showModal();document.getElementById('kioskStaffClose').onclick=()=>kioskDialog.close();const kioskFullscreen=document.getElementById('kioskFullscreen');const updateFullscreenButton=()=>{kioskFullscreen.hidden=Boolean(document.fullscreenElement);};document.addEventListener('fullscreenchange',updateFullscreenButton);updateFullscreenButton();kioskFullscreen.onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});</script>{% endblock %}{% block brand_footer %}{% endblock %}
