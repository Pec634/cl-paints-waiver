<h2>Booking profile</h2><p>Save these details once to prefill the Client Details section of your booking requests. You can choose “Prefer not to say” for ethnicity and religion.</p>
<label>Client type<select name="client_type" required>{% for value, label in [('individual','Private individual'),('business','Business')] %}<option value="{{ value }}" {% if form_data.get('client_type', 'individual') == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label>Title (optional)<select name="title"><option value="">Select</option>{% for title in ['Mr','Mrs','Miss','Ms','Mx','Dr','Other'] %}<option {% if form_data.get('title') == title %}selected{% endif %}>{{ title }}</option>{% endfor %}</select></label>
<label>Job title (required for business clients)<input name="job_title" maxlength="120" value="{{ form_data.get('job_title', '') }}"></label>
<label>Date of birth<input name="date_of_birth" type="date" value="{{ form_data.get('date_of_birth', '') }}" required></label>
<label>Ethnic group<select name="ethnicity" required><option value="">Choose one</option>{% for group in profile_ethnicities %}<option {% if form_data.get('ethnicity') == group %}selected{% endif %}>{{ group }}</option>{% endfor %}<option {% if form_data.get('ethnicity') == 'Prefer not to say' %}selected{% endif %}>Prefer not to say</option></select></label>
<label>Ethnic background<select name="ethnicity_detail" required><option value="Prefer not to say">Prefer not to say</option>{% for group, choices in profile_ethnicities.items() %}<optgroup label="{{ group }}">{% for choice in choices %}<option {% if form_data.get('ethnicity_detail') == choice %}selected{% endif %}>{{ choice }}</option>{% endfor %}</optgroup>{% endfor %}</select></label>
<label>Religion<select name="religion" required><option value="">Choose one</option>{% for choice in ['Christian','Muslim','Hindu','Sikh','Buddhist','Jewish','Other','No Religion','Prefer not to say'] %}<option {% if form_data.get('religion') == choice %}selected{% endif %}>{{ choice }}</option>{% endfor %}</select></label>
