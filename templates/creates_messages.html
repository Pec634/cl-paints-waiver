{% for message in messages %}<article class="panel"><a href="{{ url_for('creates_order',order_id=message.order_id) }}">O-{{ '%06d'|format(message.order_id) }}</a><p>{{ message.created_at.strftime('%d/%m/%Y %H:%M') }} UTC · {{ message.result }}</p><h3>{{ message.subject }}</h3><pre style="white-space:pre-wrap">{{ message.body }}</pre></article>{% else %}<p>No communication recorded.</p>{% endfor %}
