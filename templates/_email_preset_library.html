<details class="panel email-preset-library" open><summary>Saved template library</summary><p>Save independent copies of your subject, text blocks, design, images and attachments. Load a preset into the selected response type, preview it, then save to apply it. Shared heading, footer and colours still apply across response types.</p>
<div class="client-form"><label>Preset name<input data-preset-name maxlength="100" placeholder="e.g. Event enquiry reply"></label><button type="button" class="btn" data-preset-save>Save current draft as preset</button><label>Saved presets<select data-preset-select><option value="">Choose a preset</option></select></label><div class="client-action-row"><button type="button" class="btn" data-preset-load>Load into current response</button><a class="btn" data-preset-export hidden>Export preset</a><button type="button" class="btn" data-preset-delete>Delete preset</button></div><label>Import preset file<input type="file" accept=".json,application/json" data-preset-file></label><button type="button" class="btn" data-preset-import>Import into library</button><p role="status" aria-live="polite" data-preset-status></p></div></details>
