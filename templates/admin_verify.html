{% extends 'base.html' %}{% block title %}Admin verification | CL Paints{% endblock %}{% block body %}<main class="kiosk-customer panel"><h1>Verify admin sign-in</h1><p>Enter the six-digit code sent to your configured admin recovery email. It expires after 10 minutes.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" class="client-form"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Verification code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label><button class="btn primary">Verify and sign in</button></form><a href="{{ url_for('admin_login') }}">Back to sign-in</a></main>{% endblock %}
