{% if pagination.pages>1 %}<nav class="client-action-row" aria-label="Results pagination">{% if pagination.has_prev %}<a href="{{ url_for(request.endpoint,page=pagination.prev_num,q=query,view=mode|default(''),source=source|default(''),state=state|default('')) }}">Previous</a>{% endif %}<span>Page {{ pagination.page }} of {{ pagination.pages }}</span>{% if pagination.has_next %}<a href="{{ url_for(request.endpoint,page=pagination.next_num,q=query,view=mode|default(''),source=source|default(''),state=state|default('')) }}">Next</a>{% endif %}</nav>{% endif %}
