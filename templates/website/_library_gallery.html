{% set selected_photos = website_library_photos|selectattr('home' if page=='home' else page)|list %}
{% if selected_photos %}<section class="section"><span class="eyebrow">SHARED WITH PERMISSION</span><h2>{{ 'More colourful moments' if page=='gallery' else 'Moments from our community' }}</h2><div class="photo-grid gallery">{% for photo in selected_photos %}<figure><img src="{{ website_library_image(photo) }}" alt="{{ photo.alt }}" width="600" height="700" loading="lazy" decoding="async">{% if photo.caption %}<figcaption>{{ photo.caption }}</figcaption>{% endif %}</figure>{% endfor %}</div></section>{% endif %}
