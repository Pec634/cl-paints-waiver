<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shipping address — {{ order.number }}</title>
  <style>
    body { margin: 0; padding: 24px; background: white; color: black; font-family: Arial, sans-serif; }
    .print-controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 32px; }
    button { padding: 12px 18px; cursor: pointer; font: inherit; }
    address { font-style: normal; font-size: 18pt; line-height: 1.5; overflow-wrap: anywhere; }
    .shipping-address { white-space: pre-line; }
    @page { margin: 15mm; }
    @media print { body { padding: 0; } .print-controls { display: none; } address { break-inside: avoid; } }
  </style>
  <script src="{{ url_for('static', filename='cl-creates-print.js') }}" defer></script>
</head>
<body>
  <div class="print-controls"><button type="button" id="print-shipping-address">Print shipping address</button><a href="{{ url_for('creates_order', order_id=order.id) }}">Back to order {{ order.number }}</a></div>
  <main><address aria-label="Shipping address"><strong>{{ order.first_name }} {{ order.last_name }}</strong><div class="shipping-address">{{ order.address }}</div></address></main>
</body>
</html>
