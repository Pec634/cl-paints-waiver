{% extends 'client/base.html' %}{% block content %}<h1>My form submissions</h1>{% for item in entries %}<article class="panel"><h2>{{ item.title_snapshot }}</h2><p>F-{{ item.id }} · {{ item.created_at.strftime('%d/%m/%Y') }}</p><a class="btn" href="{{ url_for('native_form_submission',submission_id=item.id) }}">View submission and permissions</a></article>{% else %}<p>No giveaway or media submissions yet.</p>{% endfor %}{% endblock %}
