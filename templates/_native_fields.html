{% for field in fields %}<label>{{ field.label }}{% if field.type == 'textarea' %}<textarea name="custom_{{ loop.index0 }}" maxlength="2000" {% if field.required %}required{% endif %}>{{ request.form.get('custom_' ~ loop.index0,'') }}</textarea>{% elif field.type == 'select' %}<select name="custom_{{ loop.index0 }}" {% if field.required %}required{% endif %}><option value="">Choose an option</option>{% for option in field.options %}<option value="{{ option }}">{{ option }}</option>{% endfor %}</select>{% elif field.type == 'checkbox' %}<input type="checkbox" name="custom_{{ loop.index0 }}" value="yes" {% if field.required %}required{% endif %}>{% else %}<input type="{{ field.type }}" name="custom_{{ loop.index0 }}" value="{{ request.form.get('custom_' ~ loop.index0,'') }}" {% if field.type == 'number' %}step="any"{% endif %} maxlength="2000" {% if field.required %}required{% endif %}>{% endif %}</label>{% endfor %}
