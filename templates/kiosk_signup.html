{% extends 'base.html' %}{% block body %}<main class="kiosk-customer panel"><h1>Welcome to CL Paints</h1><p>Create your account and complete your waiver. We’ll email a verification code to link your waiver securely. Existing customers can use the same verified email.</p><form method="post" action="{{ url_for('client.signup') }}" class="client-form"><input type="hidden" name="csrf_token" value="{{ client_csrf }}"><label>First name<input name="first_name" maxlength="100" autocomplete="given-name" required></label><label>Surname<input name="last_name" maxlength="100" autocomplete="family-name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><button class="btn primary">Email my verification code</button></form><p>Each customer is signed out when staff reset this kiosk.</p></main>{% endblock %}
