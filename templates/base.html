<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}CL Paints{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='portal-experience.css') }}"><script src="{{ url_for('static', filename='portal-controls.js') }}"></script></head><body><a class="portal-skip-link" href="#portal-main">Skip to content</a>{% block body %}{% endblock %}{% include '_portal_controls.html' %}{% block brand_footer %}<footer class="brand-slogan">Bringing colour to life - One face at time ? <a href="{{ url_for('privacy_policy') }}">Privacy policy</a></footer>{% endblock %}<script src="{{ url_for('static', filename='waiver.js') }}"></script>{% if client_session_expires %}<p class="client-session-timer" data-client-session-expires="{{ client_session_expires }}" data-login-url="{{ url_for('client.login', expired=1) }}">Your sign-in has a fixed expiry.</p><script src="{{ url_for('static', filename='client-session.js') }}" defer></script>{% endif %}</body></html>
