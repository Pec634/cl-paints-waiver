<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ event.name }} | Moodboard QR sign</title>
<style>
body{font-family:Arial,sans-serif;color:#10213f;background:#f4f6fa;margin:0;padding:24px;text-align:center}nav{margin-bottom:24px}nav a,button{display:inline-block;padding:12px;font:inherit;cursor:pointer}main{max-width:700px;margin:auto;background:white;padding:48px 24px;border-radius:16px}h1{font-size:36px}.brand{font-size:30px;font-weight:bold}.brand span{color:#f52f83}img{width:320px;max-width:100%;height:auto}p{line-height:1.6}small{display:block;overflow-wrap:anywhere;margin-top:24px}@page{size:A4;margin:18mm}@media print{body{background:white;padding:0}nav{display:none}main{padding:20mm 0}img{width:85mm}}
</style></head>
<body><nav><a href="{{ url_for('admin_event_moodboard', event_id=event.id) }}">Back to event moodboard</a><button type="button" onclick="window.print()">Print / save as PDF</button></nav>
<main><div class="brand">CL <span>Paints</span></div><h1>Choose your face paint</h1><h2>{{ event.name }}</h2><p>Scan to explore this event's moodboard</p>
<img src="{{ url_for('admin_event_moodboard_qr', event_id=event.id) }}" alt="Moodboard QR code for {{ event.name }}">
<p>Open your phone camera and scan the QR code to view the designs.</p><small>{{ url_for('event_moodboard', event_id=event.id, _external=True) }}</small></main></body></html>
