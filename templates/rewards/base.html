{% extends 'base.html' %}
{% block title %}Rewards | CL Paints{% endblock %}
{% block body %}
<div class="admin">
    {% include '_admin_sidebar.html' %}
    <main class="rewards-main">
        {% for category, message in get_flashed_messages(with_categories=true) %}
        <p class="{{ 'booking-admin-error' if category == 'error' else 'booking-admin-notice' }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</div>
{% endblock %}
