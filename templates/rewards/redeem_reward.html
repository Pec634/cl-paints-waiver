
{% extends "rewards/base.html" %}
{% block content %}
<section class="form-card">
  <div class="eyebrow">REDEEM REWARD</div>
  <h2>{{ record.customer_name }}</h2>

  <div class="detail-grid">
    <div><span>Referral code</span><strong>{{ record.code }}</strong></div>
    <div><span>Reward earned</span><strong>{{ record.display_reward_earned_date }}</strong></div>
    <div><span>Reward</span><strong>{{ record.reward_text }}</strong></div>
    <div><span>Validity</span><strong>No expiry once earned</strong></div>
  </div>

  <form method="post" class="form-grid">
    <label>
      Redemption date
      <input name="redeemed_date" value="{{ redeemed_date }}" placeholder="DD/MM/YYYY" required>
    </label>
    <div class="form-actions">
      <a class="btn btn-ghost" href="{{ url_for('rewards.dashboard', section='earned') }}">Cancel</a>
      <button class="btn btn-yellow" type="submit">Mark as Redeemed</button>
    </div>
  </form>
</section>
{% endblock %}
