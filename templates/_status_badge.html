{% set badge_tone = 'success' if badge_status in ['Accepted','Open','Paid','Valid','Completed'] else 'warning' if badge_status in ['Under Review','Pending','Deposit due'] else 'danger' if badge_status in ['Declined','Cancelled','Overdue'] else 'neutral' %}<span class="workspace-badge" data-tone="{{ badge_tone }}">{{ badge_status }}</span>
