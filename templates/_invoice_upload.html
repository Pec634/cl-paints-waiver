<section class="panel"><h2>Upload an invoice</h2><p>PDF, JPG, PNG or WebP, up to 10 MB. Uploaded invoices are visible to the client.</p><form class="client-form" method="post" enctype="multipart/form-data" action="{{ url_for('upload_invoice_document',client_id=account.id) }}"><input type="hidden" name="csrf_token" value="{{ client_csrf }}"><label>Booking<select name="booking_id" required>{% for booking in client_bookings %}<option value="{{ booking.id }}">{{ booking.public_reference }} &middot; {{ booking.event_date.strftime('%d/%m/%Y') }} &middot; {{ booking.event_type }}</option>{% endfor %}</select></label><label>Invoice document or image<input type="file" name="invoice_document" accept="application/pdf,image/jpeg,image/png,image/webp" required></label><button class="btn primary">Upload invoice</button></form></section>
