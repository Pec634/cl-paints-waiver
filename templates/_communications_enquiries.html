{% for enquiry,account,workflow in pagination.items %}<article class="client-record" id="enquiry-{{ enquiry.id }}"><strong>{{ enquiry.subject }} &middot; {{ account.first_name }} {{ account.last_name }}</strong><span>{{ account.email }} &middot; {{ enquiry.created_at.strftime('%d/%m/%Y %H:%M') }}</span><p class="client-message">{{ enquiry.message }}</p><form method="post" class="client-form" action="{{ url_for('update_enquiry',enquiry_id=enquiry.id) }}"><input type="hidden" name="csrf_token" value="{{ client_csrf }}"><input type="hidden" name="return_to" value="communications"><label>Status<select name="status">{% for status in ['new','replied','resolved'] %}<option value="{{ status }}" {% if (workflow.status if workflow else 'new')==status %}selected{% endif %}>{{ status|capitalize }}</option>{% endfor %}</select></label><label>Current reply visible to the client<textarea name="reply" rows="4" maxlength="3000">{{ workflow.reply if workflow else '' }}</textarea></label><button class="btn">Save status &amp; reply</button></form></article>{% else %}<p>No enquiries match these filters.</p>{% endfor %}
