<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ code.name }} | Printable QR sign</title><style>
*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;color:#10213f;background:#f4f6fa;margin:0;padding:24px}.sign-tools{display:flex;gap:12px;justify-content:center;margin-bottom:24px}.sign-tools a,.sign-tools button{padding:12px 18px;background:white;border:1px solid #dde3ec;border-radius:8px;color:#10213f;font:inherit;cursor:pointer;text-decoration:none}.qr-sign{max-width:700px;margin:auto;text-align:center;background:white;border:1px solid #dde3ec;border-radius:16px;padding:60px 40px}.brand{font-size:30px;font-weight:850}.brand span{color:#f52f83}h1{font-size:36px;margin:24px 0}p{color:#59677d;line-height:1.6}.qr-sign img{width:320px;height:320px;max-width:100%;object-fit:contain}small{display:block;overflow-wrap:anywhere;margin-top:24px}@page{size:A4;margin:18mm}@media print{body{padding:0;background:white}.sign-tools{display:none}.qr-sign{border:0;border-radius:0;max-width:none;padding:20mm 0}.qr-sign img{width:85mm;height:85mm}}
</style></head><body><div class="sign-tools"><a href="{{ url_for('admin_qr_analytics') }}">Back to QR analytics</a><button type="button" onclick="window.print()">Print / save as PDF</button></div><main class="qr-sign"><div class="brand">CL <span>Paints</span></div><h1>{{ code.name }}</h1><p>Scan with your phone camera</p><img src="{{ url_for('settings_qr_code', code=code.token) }}" alt="QR code for {{ code.name }}"><p>Bringing colour to life — one face at a time</p><small>{{ code.destination }}</small></main></body></html>
