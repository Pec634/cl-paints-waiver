pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google(); mavenCentral()
        exclusiveContent {
            forRepository { maven { url 'https://maven.sumup.com/releases' } }
            filter { includeGroupByRegex 'com\\.sumup.*'; includeGroup 'net.sf.smc' }
        }
    }
}
rootProject.name = 'CL Paints'
include ':app'
include ':pos'
