plugins { id 'com.android.application' }

android {
    namespace 'com.clpaints.pos'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.clpaints.pos'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }
    sourceSets { main.res.srcDirs += ['../app/src/main/res'] }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }
        release { minifyEnabled false }
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    // 7.1 supports target 36 and the existing AGP 8 build; 7.2 requires AGP 9.
    implementation 'com.sumup:merchant-sdk:7.1.0'
    // Keep the SDK's Compose UI versions available to lint's test classpath too.
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    androidTestImplementation platform('androidx.compose:compose-bom:2024.09.00')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
